<script>(function(){
var P=JSON.parse(document.getElementById('p8-payload').textContent);
var f=document.getElementById('f'),pw=document.getElementById('pw'),msg=document.getElementById('msg'),btn=document.getElementById('go'),rem=document.getElementById('rem');
var K='p8-status-key';
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function tob64(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function say(t,err){msg.textContent=t;msg.className=err?'err':''}
function busy(on){btn.disabled=on;btn.textContent=on?'Entschlüssele …':'Öffnen'}
if(!(window.crypto&&crypto.subtle)){say('Dieser Browser unterstützt keine Entschlüsselung. Bitte Safari oder Chrome aktuell verwenden.',1);btn.disabled=true;return}
if(location.hash==='#abmelden'){try{localStorage.removeItem(K)}catch(e){}history.replaceState(null,'',location.pathname)}
var enc=new TextEncoder();
function derive(p){return crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']).then(function(b){
 return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64(P.salt),iterations:P.iter},b,{name:'AES-GCM',length:256},true,['decrypt'])})}
function show(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv),additionalData:enc.encode(P.aad)},key,b64(P.ct)).then(function(pt){
 var h=new TextDecoder().decode(pt);document.open();document.write(h);document.close();return key})}
function remember(key){if(!rem.checked)return;crypto.subtle.exportKey('raw',key).then(function(r){try{localStorage.setItem(K,JSON.stringify({salt:P.salt,iter:P.iter,k:tob64(r)}))}catch(e){}})}
try{var s=JSON.parse(localStorage.getItem(K)||'null');
 if(s&&s.salt===P.salt&&s.iter===P.iter){busy(true);crypto.subtle.importKey('raw',b64(s.k),{name:'AES-GCM'},true,['decrypt']).then(show).catch(function(){localStorage.removeItem(K);busy(false)})}}catch(e){}
f.addEventListener('submit',function(ev){ev.preventDefault();var p=pw.value.trim();if(!p){say('Bitte Passwort eingeben.',1);return}
 busy(true);say('');var k1;
 derive(p).then(function(k){k1=k;return show(k)}).then(remember).catch(function(){
  var q=p.toLowerCase();if(q===p)throw 0;return derive(q).then(function(k){k1=k;return show(k)}).then(remember)})
 .catch(function(){busy(false);say('Passwort stimmt nicht. Bitte nochmals versuchen.',1);pw.select()})});
pw.focus();
})();</script></body></html>
